name: Build & Publish Free Android APK Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (compatible with AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (uses gradle/wrapper/gradle-wrapper.properties -> 9.3.1)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses (for compileSdk 36.1 auto-download)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore consistent debug keystore (for seamless in-place updates)
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Compute auto-incremented version code & tag
        id: version
        run: |
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}-${BUILD_NUM}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "code=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = [0-9]\+/versionCode = ${BUILD_NUM}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - name: Build Android APK using Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK for clean download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Aab-e-Baraan-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release (Free OTA Update Endpoint)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Aab-e-Baraan RO Manager v${{ steps.version.outputs.name }}"
          body: |
            Automatic build from commit `${{ github.sha }}`.
            Open the Aab-e-Baraan RO Manager app and tap **Update Now** to install this update without USB debugging.
          files: "Aab-e-Baraan-v${{ steps.version.outputs.name }}.apk"
