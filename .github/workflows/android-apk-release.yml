name: Build & Publish Free Android APK Update

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (compatible with AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (uses gradle/wrapper/gradle-wrapper.properties -> 9.3.1)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses (for compileSdk 36.1 auto-download)
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore signing keystore & Firebase google-services.json
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 1. Restore consistent debug.keystore (for Google Sign-In SHA-1 & seamless in-place updates)
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
              echo "Restored debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64."
            elif [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            fi
          fi

          # 2. Restore app/google-services.json (for Firebase Auth, Firestore & Google Sign-In)
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//')"
            case "$TRIMMED" in
              \{*)
                printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
                ;;
              *)
                printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
                ;;
            esac
            echo "Restored app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
          fi

          # 3. Validate both files before spending minutes building
          MISSING=0
          if [ ! -s debug.keystore ]; then
            echo "::error::Missing debug.keystore! Add GitHub Secret 'DEBUG_KEYSTORE_BASE64' (copy content of debug.keystore.base64 from AI Studio -> GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret)."
            MISSING=1
          fi
          if [ ! -s app/google-services.json ]; then
            echo "::error::Missing app/google-services.json! Add GitHub Secret 'GOOGLE_SERVICES_JSON' (copy content of app/google-services.json from AI Studio -> GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret)."
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

      - name: Compute auto-incremented version code & tag
        id: version
        run: |
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}-${BUILD_NUM}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "code=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = [0-9]\+/versionCode = ${BUILD_NUM}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

      - name: Build Android APK using Gradle Wrapper
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK for clean download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "Aab-e-Baraan-v${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release (Free OTA Update Endpoint)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Aab-e-Baraan RO Manager v${{ steps.version.outputs.name }}"
          make_latest: true
          body: |
            Automatic build v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }}) from commit `${{ github.sha }}`.
            Open Aab-e-Baraan RO Manager -> Sync & Updates -> tap **Check Update** -> **Download & Install Update**.
          files: "Aab-e-Baraan-v${{ steps.version.outputs.name }}.apk"
